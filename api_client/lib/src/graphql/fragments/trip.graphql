fragment TripFields on TripType {
    id
    title # Attention : votre schéma utilise 'title' et non 'name'
    date
    description
    images {
        ...Images
    }
}

fragment Images on ImageType {
    id
    path
}

fragment SegmentFields on SegmentType {
    id
    type
    intermediatePoints {
        lat
        lng
    }
}

fragment WaypointFields on WaypointType {
    id
    lat
    lng
    type
    title
    description
    images {
        ...Images
    }
}
