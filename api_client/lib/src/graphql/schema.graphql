"""Exposes a URL that specifies the behavior of this scalar."""
directive @specifiedBy(
  """The URL that specifies the behavior of this scalar."""
  url: String!
) on SCALAR

"""Indicates an Input Object is a OneOf Input Object."""
directive @oneOf on INPUT_OBJECT

type AppConfigType {
  imageBaseUrl: String!
}

"""Date (isoformat)"""
scalar Date

"""Date with time (isoformat)"""
scalar DateTime

input ImageInput {
  fileKey: String!
}

type ImageType implements Node {
  """The Globally Unique ID of this object"""
  id: ID!
  fileKey: String!
  createdAt: DateTime!
}

input LatLngInput {
  lat: Float!
  lng: Float!
}

type LatLngType {
  lat: Float!
  lng: Float!
}

input ManyToManyInput {
  add: [ID!]
  remove: [ID!]
  set: [ID!]
}

type Mutation {
  createTrip(trip: TripInput!): TripType!
  updateTrip(trip: TripUpdateInput!): TripType!
  deleteTrip(input: TripDeleteInput!): TripType!
  createImage(image: ImageInput!): ImageType!
  generateImageUploadUrl(extension: String!): UploadConfig!
}

"""An object with a Globally Unique ID"""
interface Node {
  """The Globally Unique ID of this object"""
  id: ID!
}

type Query {
  node(
    """The ID of the object."""
    id: ID!
  ): Node!
  trips: [TripType!]!
  appConfig: AppConfigType!
}

input SegmentInput {
  type: SegmentTypeEnum!
  intermediatePoints: [LatLngInput!]!
}

type SegmentType implements Node {
  """The Globally Unique ID of this object"""
  id: ID!
  type: SegmentTypeEnum!
  intermediatePoints: [LatLngType!]!
}

enum SegmentTypeEnum {
  bike
  car
  boat
  walk
  train
}

input TripDeleteInput {
  id: ID!
}

input TripInput {
  title: String!
  description: String
  date: Date
  images: ManyToManyInput
  waypoints: [WaypointInput!] = null
  segments: [SegmentInput!] = null
}

type TripType implements Node {
  """The Globally Unique ID of this object"""
  id: ID!
  title: String!
  description: String!
  date: Date
  images: [ImageType!]!
  waypoints: [WaypointType!]!
  segments: [SegmentType!]!
}

input TripUpdateInput {
  id: ID!
  title: String
  description: String
  date: Date
  images: ManyToManyInput
  waypoints: [WaypointInput!] = null
  segments: [SegmentInput!] = null
}

type UploadConfig {
  uploadUrl: String!
  fileKey: String!
}

input WaypointInput {
  lat: Float!
  lng: Float!
  type: WaypointTypeEnum!
  title: String
  description: String
  images: ManyToManyInput
}

type WaypointType implements Node {
  """The Globally Unique ID of this object"""
  id: ID!
  lat: Float!
  lng: Float!
  title: String!
  description: String!
  images: [ImageType!]!
  type: WaypointTypeEnum!
}

enum WaypointTypeEnum {
  start
  end
  waypoint
  water
  food
  repair
  shelter
  camping
  viewpoint
  historic
  beach
  boat
  warning
}

