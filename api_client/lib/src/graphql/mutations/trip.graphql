#import "../fragments/trip.graphql"
mutation CreateTrip($trip: TripInput!) {
    createTrip(input: { trip: $trip }) {
        clientMutationId
        trip {
            ...TripFields
            waypoints {
                ...WaypointFields
            }
            segments {
                ...SegmentFields
            }
        }
    }
}

mutation UpdateTrip($id: ID!, $trip: TripInput!) {
    updateTrip(input: { id: $id, trip: $trip }) {
        clientMutationId
        trip {
            ...TripFields
            waypoints {
                ...WaypointFields
            }
            segments {
                ...SegmentFields
            }
        }
    }
}

mutation DeleteTrip($id: ID!) {
    deleteTrip(input: { id: $id }) {
        clientMutationId
        deletedId
    }
}
