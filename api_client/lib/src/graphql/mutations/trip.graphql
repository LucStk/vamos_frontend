#import "../fragments/trip.graphql"
mutation CreateTrip($trip: TripInput!) {
    createTrip(trip: $trip) {
        ...TripFields
        waypoints {
            ...WaypointFields
        }
        segments {
            ...SegmentFields
        }
    }
}

mutation UpdateTrip($trip: TripUpdateInput!) {
    updateTrip(trip: $trip) {
        ...TripFields
        waypoints {
            ...WaypointFields
        }
        segments {
            ...SegmentFields
        }
    }
}

mutation DeleteTrip($id: ID!) {
    deleteTrip(input: { id: $id }) {
        id
    }
}
