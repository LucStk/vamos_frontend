#import "../fragments/trip.graphql"
mutation GenerateImageUploadUrl($extension: String!) {
    generateImageUploadUrl(extension: $extension) {
        fileKey
        uploadUrl
    }
}

mutation CreateImage($fileKey: String!) {
    createImage(data: { fileKey: $fileKey }) {
        ...ImageFields
    }
}
mutation AttachImageToTrip($tripId: Int!, $fileKey: String!) {
    attachImageToTrip(tripId: $tripId, fileKey: $fileKey) {
        image {
            ...ImageFields
        }
    }
}
