#import "../fragments/trip.graphql"

query GetAllTrips {
    trips {
        ...TripFields
    }
}
query GetTrip($id: ID!) {
    #  LA CORRECTION :
    node(id: $id) {
        id
        ... on TripType {
            ...TripFields
            waypoints {
                ...WaypointFields
            }
            segments {
                ...SegmentFields
            }
        }
    }
}
