analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

include: package:flutter_lints/flutter.yaml

plugins:
  riverpod_lint: ^3.1.9
  barrel_file_lints:
    version: ^1.0.5
    diagnostics:
      avoid_self_barrel_import: true

linter:
  rules:
    - always_use_package_imports
    - simple_directive_paths
