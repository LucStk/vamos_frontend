#import "../fields/segment_fields.graphql"

mutation UpdateSegment($id: UUID!, $segment: SegmentUpdateInput!) {
    updateSegment(id: $id, input: $segment) {
        ...SegmentFields
    }
}

mutation CreateSegment($tripId: UUID!, $segment: SegmentCreateInput!) {
    createSegment(tripId: $tripId, input: $segment) {
        ...SegmentFields
    }
}
mutation CorrectSegment(
    $segmentId: UUID!
    $correction: SegmentCorrectionInput!
) {
    correctSegment(segmentId: $segmentId, input: $correction) {
        ...SegmentFields
    }
}
mutation mergeSegments($tripId: UUID!, $input: SegmentMergeInput!) {
    mergeSegments(tripId: $tripId, input: $input) {
        ...SegmentMergePayloadFragment
    }
}

mutation DeleteSegment($segmentId: UUID!) {
    deleteSegment(id: $segmentId)
}
