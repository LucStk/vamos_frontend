#import "vertex_fields.graphql"

fragment SegmentFields on SegmentType {
    id
    mobilityType
    startVertex {
        ...VertexFields
    }
    endVertex {
        ...VertexFields
    }
    geometry {
        ...LatLngFields
    }
}

fragment SegmentSplicePayloadFragment on SegmentSplicePayload {
    deletedSegmentIds
    segment {
        ...SegmentFields
    }
}

fragment CreateSegmentPayloadFragment on CreateSegmentPayload {
    segment {
        ...SegmentFields
    }
    vertex {
        ...VertexFields
    }
    refinementFailed
    errorMessage
}
fragment RefineSegmentPayloadFragment on RefineSegmentPayload {
    segment {
        ...SegmentFields
    }
    refinementFailed
    errorMessage
}
