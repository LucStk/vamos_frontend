#import "waypoint_fields.graphql"
#import "/stored_file/data/graphql/file_storage_fields.graphql"

mutation UpdateWaypoint($id: UUID!, $waypoint: WaypointUpdateInput!) {
    updateWaypoint(input: $waypoint, id: $id) {
        ...WaypointFields
    }
}
mutation CreateBlankWaypointFromPosition(
    $tripId: UUID!
    $latLng: LatLngInput!
) {
    createBlankWaypointFromPosition(tripId: $tripId, latLng: $latLng) {
        ...CreateWaypointPayloadFields
    }
}

mutation CreateBlankWaypointFromVertex($tripId: UUID!, $vertexId: UUID!) {
    createBlankWaypointFromVertex(tripId: $tripId, vertexId: $vertexId) {
        ...CreateWaypointPayloadFields
    }
}

mutation DeleteWaypoint($waypointId: UUID!) {
    deleteWaypoint(id: $waypointId)
}
mutation AttachFileToWaypoint($input: AttachFileWaypointInput!) {
    attachFileToWaypoint(input: $input) {
        ...StoredFile
    }
}
