"""Exposes a URL that specifies the behavior of this scalar."""
directive @specifiedBy(
  """The URL that specifies the behavior of this scalar."""
  url: String!
) on SCALAR

"""
Indicates exactly one field must be supplied and this field must not be `null`.
"""
directive @oneOf on INPUT_OBJECT

input AttachFileInput {
  targetType: FileTargetTypeEnum!
  targetId: ID!
  fileId: ID!
}

type CreateProfileError {
  code: CreateProfileErrorCode!
}

enum CreateProfileErrorCode {
  USERNAME_ALREADY_TAKEN
  INVALID_USERNAME
}

union CreateProfileResult = CreateProfileSuccess | CreateProfileError

type CreateProfileSuccess {
  profile: UserProfileType!
}

"""Date (isoformat)"""
scalar Date

"""Date with time (isoformat)"""
scalar DateTime

input DrawRouteInput {
  points: [LatLngInput!]!
  mobilityType: MobilityType!
  autoRoute: Boolean! = true
  basedOn: DateTime = null
}

type EditRoutePayload {
  trip: TripType!
  refinementFailed: Boolean!
  errorMessage: String
}

input ExtendRouteInput {
  points: [LatLngInput!]!
  mobilityType: MobilityType!
  autoRoute: Boolean! = true
  basedOn: DateTime = null
}

type FileAttachmentType {
  order: Int!
  isCover: Boolean!
  file: StoredFileType!
}

enum FileTargetTypeEnum {
  TRIP
  WAYPOINT
}

enum GeometrySource {
  COMPUTED
  DRAWN
}

type GetMePayload {
  id: UUID!
  profile: UserProfileType
}

input ImageUploadRequest {
  filename: String!
  mimeType: String!
  size: Int!
}

input LatLngInput {
  lat: Float!
  lng: Float!
}

type LatLngType {
  lat: Float!
  lng: Float!
}

enum MobilityType {
  BIKE
  CAR
  BOAT
  WALK
  TRAIN
}

type Mutation {
  createProfile(profileName: String!): CreateProfileResult!
  updateProfile(input: UpdateUserProfileInput!): UserProfileType!
  updateTrip(id: UUID!, trip: TripUpdateInput!): TripType!
  deleteTrip(id: UUID!): Boolean!
  createBlankTrip: TripType!
  updateWaypoint(id: UUID!, input: WaypointUpdateInput!): WaypointType!
  createBlankWaypointFromPosition(tripId: UUID!, latLng: LatLngInput!): WaypointType!
  deleteWaypoint(id: UUID!): Boolean!
  drawRoute(tripId: UUID!, input: DrawRouteInput!): EditRoutePayload!
  extendRoute(tripId: UUID!, input: ExtendRouteInput!): EditRoutePayload!
  redrawRoutePortion(tripId: UUID!, input: RedrawRouteInput!): EditRoutePayload!
  refineSection(tripId: UUID!, sectionId: UUID!): EditRoutePayload!
  setSectionMobility(tripId: UUID!, sectionId: UUID!, mobilityType: MobilityType!): EditRoutePayload!
  detachFile(id: UUID!): Boolean!
  attachFile(input: AttachFileInput!): FileAttachmentType!
  generateImageUploadUrl(input: ImageUploadRequest!): UploadConfigType!
}

enum PoiCategory {
  START
  END
  WAYPOINT
  WATER
  FOOD
  REPAIR
  SHELTER
  CAMPING
  VIEWPOINT
  HISTORIC
  BEACH
  BOAT
  WARNING
}

"""
Represents a point as `(x, y, z)` or `(x, y)`. Input also accepts WKT, EWKT, HEXEWKB or GeoJSON (string or object).
"""
scalar Point

"""
A geographical object that gets 1 or 2 LinearRing objects as external and
internal rings. Input also accepts WKT, EWKT, HEXEWKB or GeoJSON (string or object).
"""
scalar Polygon

type Query {
  trip(id: UUID!): TripType!
  trips: [TripType!]!
  userTrips(userId: UUID!): [TripType!]!
  meTrips: [TripType!]!
  me: GetMePayload!
}

input RedrawRouteInput {
  start: RouteAnchorInput!
  end: RouteAnchorInput = null
  correction: [LatLngInput!]!
  mobilityType: MobilityType!
  autoRoute: Boolean! = true
  basedOn: DateTime = null
}

input RouteAnchorInput {
  sectionId: UUID!
  point: LatLngInput!
}

type RouteSectionType {
  id: UUID!
  startIndex: Int!
  mobilityType: MobilityType!
  geometrySource: GeometrySource!
}

type StoredFileType {
  id: UUID!
  filename: String!
  status: String!
  url: String!
}

type TripType {
  id: UUID!
  title: String!
  description: String!
  date: Date
  waypoints: [WaypointType!]!
  startPoint: Point
  endPoint: Point
  bounds: Polygon
  routeUpdatedAt: DateTime
  sections: [RouteSectionType!]!
  owner: UserProfileType!
  files: [FileAttachmentType!]!
  route: [LatLngType!]!
}

input TripUpdateInput {
  title: String
  description: String
  date: Date
}

input UpdateUserProfileInput {
  profilePicture: String
  bio: String
}

type UploadConfigType {
  file: StoredFileType!
  uploadUrl: String!
  fileKey: String!
  contentType: String!
}

type UserProfileType {
  id: UUID!
  profileName: String!
  profilePicture: StoredFileType
  bio: String!
}

scalar UUID

type WaypointType {
  id: UUID!
  title: String!
  description: String!
  poiCategory: PoiCategory!
  location: Point!
  anchorEdge: Int
  anchorOffset: Float!
  files: [FileAttachmentType!]!
}

input WaypointUpdateInput {
  location: LatLngInput
  title: String
  poiCategory: PoiCategory
  vertexId: Int
  description: String
}

