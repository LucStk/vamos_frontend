"""Exposes a URL that specifies the behavior of this scalar."""
directive @specifiedBy(
  """The URL that specifies the behavior of this scalar."""
  url: String!
) on SCALAR

"""Indicates an Input Object is a OneOf Input Object."""
directive @oneOf on INPUT_OBJECT

input AttachFileInput {
  targetType: FileTargetTypeEnum!
  targetId: ID!
  fileId: ID!
}

type CreateProfileError {
  code: CreateProfileErrorCode!
}

enum CreateProfileErrorCode {
  USERNAME_ALREADY_TAKEN
  INVALID_USERNAME
}

union CreateProfileResult = CreateProfileSuccess | CreateProfileError

type CreateProfileSuccess {
  profile: UserProfileType!
}

type CreateSegmentPayload {
  vertex: VertexType!
  segment: SegmentType!
  refinementFailed: Boolean!
  errorMessage: String
}

type CreateWaypointPayload {
  waypoint: WaypointType!
  vertex: VertexType!
}

"""Date (isoformat)"""
scalar Date

type FileAttachmentType {
  order: Int!
  isCover: Boolean!
  file: StoredFileType!
}

enum FileTargetTypeEnum {
  TRIP
  WAYPOINT
}

type GetMePayload {
  userId: UUID!
  profile: UserProfileType
}

input ImageUploadRequest {
  filename: String!
  mimeType: String!
  size: Int!
}

input LatLngInput {
  lat: Float!
  lng: Float!
}

type LatLngType {
  lat: Float!
  lng: Float!
}

enum MobilityType {
  BIKE
  CAR
  BOAT
  WALK
  TRAIN
}

type Mutation {
  createProfile(profileName: String!): CreateProfileResult!
  updateProfile(input: UpdateUserProfileInput!): UserProfileType!
  updateTrip(id: UUID!, trip: TripUpdateInput!): TripType!
  deleteTrip(id: UUID!): Boolean!
  createBlankTrip: TripType!
  updateWaypoint(id: UUID!, input: WaypointUpdateInput!): WaypointType!
  createBlankWaypointFromPosition(tripId: UUID!, latLng: LatLngInput!): CreateWaypointPayload!
  createBlankWaypointFromVertex(tripId: UUID!, vertexId: UUID!): CreateWaypointPayload!
  deleteWaypoint(id: UUID!): Boolean!
  createSegment(tripId: UUID!, input: SegmentCreateInput!): CreateSegmentPayload!
  deleteSegment(id: UUID!): Boolean!
  refineSegmentGeometry(segmentId: UUID!): RefineSegmentPayload!
  updateSegment(id: UUID!, input: SegmentUpdateInput!): SegmentType!
  correctSegment(segmentId: UUID!, input: SegmentCorrectionInput!): SegmentType!
  spliceSegment(tripId: UUID!, input: SpliceSegmentInput!): SegmentSplicePayload!
  moveVertex(id: UUID!, latLng: LatLngInput!): VertexType!
  createVertex(tripId: UUID!, latLng: LatLngInput!): VertexType!
  deleteVertex(id: UUID!): Boolean!
  detachFile(id: UUID!): Boolean!
  attachFile(input: AttachFileInput!): FileAttachmentType!
  generateImageUploadUrl(input: ImageUploadRequest!): UploadConfigType!
}

enum PoiCategory {
  START
  END
  WAYPOINT
  WATER
  FOOD
  REPAIR
  SHELTER
  CAMPING
  VIEWPOINT
  HISTORIC
  BEACH
  BOAT
  WARNING
}

type Query {
  trip(id: UUID!): TripType!
  trips: [TripType!]!
  me: GetMePayload!
}

type RefineSegmentPayload {
  segment: SegmentType!
  refinementFailed: Boolean!
  errorMessage: String
}

input SegmentAnchorInput {
  segmentId: UUID
  vertexId: UUID
}

input SegmentCorrectionInput {
  correction: [LatLngInput!]!
}

input SegmentCreateInput {
  id: UUID
  mobilityType: MobilityType!
  startVertexId: UUID!
  endVertexId: UUID
  geometry: [LatLngInput!]!
}

type SegmentSplicePayload {
  segment: SegmentType!
  deletedSegmentIds: [UUID!]!
}

type SegmentType {
  id: UUID!
  mobilityType: MobilityType!
  startVertex: VertexType!
  endVertex: VertexType!
  geometry: [LatLngType!]!
}

input SegmentUpdateInput {
  geometry: [LatLngInput!]!
  mobilityType: MobilityType
}

input SpliceSegmentInput {
  startAnchor: SegmentAnchorInput!
  endAnchor: SegmentAnchorInput!
  correction: [LatLngInput!]!
  mobilityType: MobilityType!
}

type StoredFileType {
  id: UUID!
  filename: String!
  status: String!
  url: String!
}

type TopologyType {
  vertices: [VertexType!]!
  segments: [SegmentType!]!
}

type TripType {
  id: UUID!
  title: String!
  description: String!
  date: Date
  waypoints: [WaypointType!]!
  files: [FileAttachmentType!]!
  topology: TopologyType!
}

input TripUpdateInput {
  title: String
  description: String
  date: Date
}

input UpdateUserProfileInput {
  profilePicture: String
  bio: String
}

type UploadConfigType {
  file: StoredFileType!
  uploadUrl: String!
  fileKey: String!
  contentType: String!
}

type UserProfileType {
  userId: UUID!
  profileName: String!
  profilPicture: StoredFileType
  bio: String!
}

scalar UUID

type VertexType {
  id: UUID!
  latLng: LatLngType!
}

type WaypointType {
  id: UUID!
  title: String!
  description: String!
  poiCategory: PoiCategory!
  vertex: VertexType!
  files: [FileAttachmentType!]!
}

input WaypointUpdateInput {
  title: String
  poiCategory: PoiCategory
  vertexId: Int
  description: String
}

