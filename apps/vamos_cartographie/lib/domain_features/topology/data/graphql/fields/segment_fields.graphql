#import "vertex_fields.graphql"

fragment RouteSectionFields on SegmentType {
    id
    mobilityType
    geometry {
        ...LatLngFields
    }
}

fragment SegmentSplicePayloadFragment on SegmentSplicePayload {
    deletedSegmentIds
    segment {
        ...RouteSectionFields
    }
}

fragment CreateSegmentPayloadFragment on CreateSegmentPayload {
    segment {
        ...RouteSectionFields
    }
    refinementFailed
    errorMessage
}
fragment RefineSegmentPayloadFragment on RefineSegmentPayload {
    segment {
        ...RouteSectionFields
    }
    refinementFailed
    errorMessage
}
