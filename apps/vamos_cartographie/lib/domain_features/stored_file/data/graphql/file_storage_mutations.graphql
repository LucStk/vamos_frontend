#import "file_storage_fields.graphql"
mutation GenerateImageUploadUrl($input: ImageUploadRequest!) {
    generateImageUploadUrl(input: $input) {
        ...UploadConfigFields
    }
}

mutation DetachFile($id: UUID!) {
    detachFile(id: $id)
}

mutation AttachFile($input: AttachFileInput!) {
    attachFile(input: $input) {
        ...FileAttachment
    }
}

mutation ReorderFiles($input: ReorderFilesInput!) {
    reorderFiles(input: $input) {
        ...FileAttachment
    }
}

mutation SetFileCaption($fileId: UUID!, $caption: String!) {
    setFileCaption(fileId: $fileId, caption: $caption) {
        ...FileAttachment
    }
}
