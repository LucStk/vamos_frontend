fragment StoredFile on StoredFileType {
    id
    filename
    status
    url
}

fragment FileAttachment on FileAttachmentType {
    order
    isCover
    file {
        ...StoredFile
    }
}

fragment UploadConfigFields on UploadConfigType {
    file {
        ...StoredFile
    }
    uploadUrl
    fileKey
    contentType
}
