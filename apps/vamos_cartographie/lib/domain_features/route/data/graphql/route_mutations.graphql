#import "route_fields.graphql"

# Prolonge la route depuis sa dernière extrémité avec un tracé à main levé.
# Ou : création d'une nouvelle route depuis le premier point
mutation EditRoute($tripId: UUID!, $input: EditRouteInput!) {
    editRoute(tripId: $tripId, input: $input) {
        ...EditRouteResult
    }
}

mutation SetTripOrigin($tripId: UUID!, $origin: LatLngInput!) {
    setTripOrigin(id: $tripId, origin: $origin) {
        ...EditRouteResult
    }
}
mutation DeleteRoute($tripId: UUID!) {
    deleteRoute(tripId: $tripId) {
        ...EditRouteResult
    }
}
