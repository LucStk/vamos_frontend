#import "/core/graphql/geo_fields.graphql"
# Ce qu'on sait de la route une fois tracée : élévation, nature des voies.
# Calculé après l'édition par le serveur ; peut manquer ou être périmé.
fragment RouteInsightsFields on RouteInsightsType {
    computedAt
    isStale
    elevationError
    waysError
    mobilities {
        mobilityType
        ascentM
        descentM
        minElevationM
        maxElevationM
        elevationProfile {
            distanceM
            elevationM
        }
        totalM
        analyzedM
        roadKinds {
            key
            lengthM
        }
        surfaces {
            key
            lengthM
        }
        cycleInfrastructure {
            key
            lengthM
        }
    }
}

# Null : jamais calculé.
query FetchRouteInsights($tripId: UUID!) {
    routeInsights(tripId: $tripId) {
        ...RouteInsightsFields
    }
}

# Relance le calcul (propriétaire seul). Null : le trip n'a pas de route.
mutation RecomputeRouteInsights($tripId: UUID!) {
    recomputeRouteInsights(tripId: $tripId) {
        ...RouteInsightsFields
    }
}

# Profil d'élévation d'un tracé qui n'est pas encore dans la route.
fragment ElevationProfileFields on ElevationProfileType {
    ascentM
    descentM
    minElevationM
    maxElevationM
    lengthM
    points {
        distanceM
        elevationM
    }
}

# Élévation de la portion qu'un aperçu ajouterait à la route. Demandée à part de
# l'aperçu, que le service d'altitude ne doit pas retarder. Null : pas de profil
# (modalité non analysée, proposition remplacée, pas d'altitude).
query FetchProposalElevation($tripId: UUID!, $proposalId: UUID!) {
    routeProposalElevation(tripId: $tripId, proposalId: $proposalId) {
        ...ElevationProfileFields
    }
}

# Nature des voies de la portion que l'aperçu ajouterait, par tronçons de nature
# constante : de quoi colorer le tracé selon le type de route.
fragment ProposalWaysFields on ProposalWaysType {
    spans {
        kind
        cycle
        lengthM
        coordinates {
            ...LatLng
        }
    }
}

# Demandée à part de l'aperçu. Null : pas de nature de voie (hors vélo,
# proposition remplacée, tracé dessiné à main levée).
query FetchProposalWays($tripId: UUID!, $proposalId: UUID!) {
    routeProposalWays(tripId: $tripId, proposalId: $proposalId) {
        ...ProposalWaysFields
    }
}
