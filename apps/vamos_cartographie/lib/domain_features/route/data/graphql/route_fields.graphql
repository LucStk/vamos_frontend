#import "/core/graphql/geo_fields.graphql"

#import "/domain_features/waypoint/data/graphql/waypoint_fields.graphql"

fragment RouteSection on RouteSectionType {
    id
    startIndex
    mobilityType
    geometrySource
}

fragment TripRoute on TripType {
    id
    routeUpdatedAt
    bounds
    startPoint {
        ...LatLng
    }
    route {
        ...LatLng
    }
    sections {
        ...RouteSection
    }
}

fragment EditRouteResult on EditRoutePayload {
    __typename
    ... on EditRouteSuccess {
        refinementError
        trip {
            ...TripRoute
        }
    }
    ... on EditRouteError {
        code
        message
    }
}
fragment RoutePreviewResult on RoutePreviewPayload {
    __typename
    ... on RoutePreviewSuccess {
        proposalId
        coordinates {
            ...LatLng
        }
        sections {
            isNew
            startIndex
            mobilityType
            geometrySource
        }
        refinementError
    }
    ... on EditRouteError {
        code
        message
    }
}
