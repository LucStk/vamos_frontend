#import "/core/graphql/geo_fields.graphql"

#import "/domain_features/waypoint/data/graphql/waypoint_fields.graphql"

# --- Calques de la route ------------------------------------------------------

# Section de modalité : ce que le viewer affiche. Son id sert d'ancre
# (SectionAnchorInput.sectionId, SectionPointInput.sectionId) et de cible
# pour refineSection / setSectionMobility.
fragment MobilitySpan on MobilitySpanType {
    id
    startIndex
    mobilityType
    lengthM
}

# Partie produite par une même action de l'utilisateur. Mode édition seulement.
fragment EditSpan on EditSpanType {
    id
    startIndex
    editId
    geometrySource
    lengthM
}

# id null : span créé par ce tracé. Pour savoir ce qui a été retracé,
# utiliser PreviewEditSpan.isNew (un span existant peut avoir été prolongé).
fragment PreviewMobilitySpan on PreviewMobilitySpanType {
    id
    startIndex
    mobilityType
}

# isNew : portion produite par ce tracé, à surligner.
fragment PreviewEditSpan on PreviewEditSpanType {
    id
    startIndex
    editId
    geometrySource
    isNew
}

# --- Trip ---------------------------------------------------------------------

# Ce dont le viewer a besoin pour dessiner la route.
fragment TripRoute on TripType {
    id
    routeUpdatedAt
    # Objet dans le schéma (DjangoGeometryType) : une sous-sélection est obligatoire.
    bounds {
        ...Bounds
    }
    startPoint {
        ...LatLng
    }
    route {
        ...LatLng
    }
    mobilitySpans {
        ...MobilitySpan
    }
}

# Le viewer, plus l'historique des tracés : pour le mode édition.
fragment TripRouteEditing on TripType {
    ...TripRoute
    editSpans {
        ...EditSpan
    }
}

# --- Résultats des mutations --------------------------------------------------

fragment EditRouteResult on EditRoutePayload {
    __typename
    ... on EditRouteSuccess {
        refinementError
        trip {
            ...TripRouteEditing
        }
    }
    ... on EditRouteError {
        code
        message
    }
}

fragment RoutePreviewResult on RoutePreviewPayload {
    __typename
    ... on RoutePreviewSuccess {
        proposalId
        coordinates {
            ...LatLng
        }
        mobilitySpans {
            ...PreviewMobilitySpan
        }
        editSpans {
            ...PreviewEditSpan
        }
        refinementError
    }
    ... on EditRouteError {
        code
        message
    }
}
