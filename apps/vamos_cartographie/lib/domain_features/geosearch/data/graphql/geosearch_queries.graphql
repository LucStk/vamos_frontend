#import "./geosearch_fields.graphql"

query SearchPlaces(
    $q: String!
    $origin: LatLngInput
    $limit: Int!
    $radiusKm: Float
    $mode: SearchMode!
) {
    searchPlaces(
        q: $q
        origin: $origin
        limit: $limit
        radiusKm: $radiusKm
        mode: $mode
    ) {
        mode
        category {
            key
            label
        }
        results {
            ...PlaceResultFields
        }
    }
}
