#import "/stored_file/data/graphql/file_storage_fields.graphql"
#import "/topology/data/graphql/fields/vertex_fields.graphql"

fragment WaypointFields on WaypointType {
    id
    poiCategory
    title
    description
    files {
        ...FileAttachment
    }
    vertex {
        ...VertexFields
    }
}
fragment CreateWaypointPayloadFields on CreateWaypointPayload {
    waypoint {
        ...WaypointFields
    }
    vertex {
        ...VertexFields
    }
}
