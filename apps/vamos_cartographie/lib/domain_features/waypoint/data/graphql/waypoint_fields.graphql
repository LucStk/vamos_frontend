#import "/core/graphql/geo_fields.graphql"
#import "/domain_features/stored_file/data/graphql/file_storage_fields.graphql"

fragment WaypointFields on WaypointType {
    id
    anchorEdge
    anchorOffset
    poiCategory
    title
    description
    location {
        ...LatLngFields
    }
    files {
        ...FileAttachment
    }
}
fragment WaypointAnchorFields on WaypointType {
    id
    anchorEdge
    anchorOffset
}
