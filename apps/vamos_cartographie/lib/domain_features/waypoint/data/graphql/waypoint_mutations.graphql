#import "waypoint_fields.graphql"
#import "/domain_features/stored_file/data/graphql/file_storage_fields.graphql"

mutation UpdateWaypoint($id: UUID!, $waypoint: WaypointUpdateInput!) {
    updateWaypoint(input: $waypoint, id: $id) {
        ...WaypointFields
    }
}

mutation CreateBlankWaypointFromPosition(
    $tripId: UUID!
    $latLng: LatLngInput!
) {
    createBlankWaypointFromPosition(tripId: $tripId, latLng: $latLng) {
        ...WaypointFields
    }
}
