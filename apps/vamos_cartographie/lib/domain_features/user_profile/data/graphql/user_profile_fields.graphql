#import "/domain_features/stored_file/data/graphql/file_storage_fields.graphql"
fragment UserProfileDetails on UserProfileType {
    id
    profileName
    profilePicture {
        ...StoredFile
    }
    bio
}
fragment CreateProfileResult on CreateProfileResult {
    ... on CreateProfileSuccess {
        profile {
            ...UserProfileDetails
        }
    }
    ... on CreateProfileError {
        code
    }
}
