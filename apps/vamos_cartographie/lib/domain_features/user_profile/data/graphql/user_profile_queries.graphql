# import "user_profile_fields.graphql"
query GetMe {
    me {
        id
        profile {
            ...UserProfileDetails
        }
    }
}

query GetUser($userId: UUID!) {
    user(userId: $userId) {
        ...UserProfileDetails
    }
}

query GetFollowers($userId: UUID!) {
    followers(userId: $userId) {
        ...UserProfileDetails
    }
}
query GetFollowing($userId: UUID!) {
    following(userId: $userId) {
        ...UserProfileDetails
    }
}
