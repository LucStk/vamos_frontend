#import "user_profile_fields.graphql"
mutation CreateProfile($profileName: String!) {
    createProfile(profileName: $profileName) {
        ... on CreateProfileSuccess {
            profile {
                ...UserProfileFields
            }
        }
        ... on CreateProfileError {
            code
        }
    }
}
mutation UpdateProfile($input: UpdateUserProfileInput!) {
    updateProfile(input: $input) {
        ...UserProfileFields
    }
}
