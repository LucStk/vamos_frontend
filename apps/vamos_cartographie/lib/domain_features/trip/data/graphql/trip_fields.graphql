#import "/domain_features/stored_file/data/graphql/file_storage_fields.graphql"
#import "/domain_features/user_profile/data/graphql/user_profile_fields.graphql"
#import "/domain_features/route/data/graphql/route_fields.graphql"

fragment TripFields on TripType {
    id
    title
    date
    description
    files {
        ...FileAttachment
    }
    owner {
        ...UserProfileFields
    }
}

fragment TripWithRouteFields on TripType {
    ...TripFields
    ...TripRouteFields
}
