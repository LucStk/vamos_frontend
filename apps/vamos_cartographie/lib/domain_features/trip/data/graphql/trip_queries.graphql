#import "/core/graphql/geo_fields.graphql"
#import "/domain_features/waypoint/data/graphql/waypoint_fields.graphql"
#import "trip_fields.graphql"

query GetAllTripBundles {
    trips {
        ...TripFull
    }
}
query GetTripBundle($id: UUID!) {
    trip(id: $id) {
        ...TripFull
    }
}

query GetTripSummary($id: UUID!) {
    trip(id: $id) {
        ...TripSummary
    }
}
query GetMeTripsSummary() {
    meTrips() {
        ...TripSummary
    }
}
query GetUserTripsSummary($id : UUID!) {
    userTrips(userId :$id) {
        ...TripSummary
    }
}

query GetMeSavedTrips() {
    meSavedTrips() {
        ...TripSummary
    }
}
query GetUserSavedTrips($userId : UUID!) {
    userSavedTrips(userId : $userId) {
        ...TripSummary
    }
}

query DiscoverTrips($tiles: [TileInput!]!, $filters: TripDiscoveryFilters, $perTile: Int!) {
    discoverTrips(tiles: $tiles, filters: $filters, perTile: $perTile) {
        z
        x
        y
        trips {
            score
            preview {
                ...LatLng
            }
            trip {
                ...TripSummary
            }
        }
    }
}
