#import "/waypoint/data/graphql/waypoint_fields.graphql"
#import "trip_fields.graphql"
#import "/topology/data/graphql/fields/segment_fields.graphql"
#import "/topology/data/graphql/fields/vertex_fields.graphql"

query GetAllTrips {
    trips {
        ...TripFields
        topology {
            ...TopologyFields
        }
    }
}

query GetTrip($id: UUID!) {
    trip(id: $id) {
        ...TripFields
    }
}

query GetTripDetails($id: UUID!) {
    trip(id: $id) {
        ...TripFields
        waypoints {
            ...WaypointFields
        }
        topology {
            ...TopologyFields
        }
    }
}
