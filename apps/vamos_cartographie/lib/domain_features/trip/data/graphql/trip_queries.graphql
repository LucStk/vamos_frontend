#import "/domain_features/waypoint/data/graphql/waypoint_fields.graphql"
#import "trip_fields.graphql"

query GetAllTripBundles {
    trips {
        ...TripFull
    }
}
query GetTripBundle($id: UUID!) {
    trip(id: $id) {
        ...TripFull
    }
}

query GetTripSummary($id: UUID!) {
    trip(id: $id) {
        ...TripSummary
    }
}
query GetMeTripsSummary() {
    meTrips() {
        ...TripSummary
    }
}
query GetUserTripsSummary($id : UUID!) {
    userTrips(userId :$id) {
        ...TripSummary
    }
}
