#import "/domain_features/waypoint/data/graphql/waypoint_fields.graphql"
#import "trip_fields.graphql"

query GetAllTrips {
    trips {
        ...TripFields

    }
}

query GetTrip($id: UUID!) {
    trip(id: $id) {
        ...TripFields
    }
}
query GetMeTrips() {
    meTrips() {
        ...TripFields
    }
}
query GetUserTrips($id : UUID!) {
    userTrips(userId :$id) {
        ...TripFields
    }
}
query GetTripDetails($id: UUID!) {
    trip(id: $id) {
        ...TripFields
        waypoints {
            ...WaypointFields
        }

    }
}
