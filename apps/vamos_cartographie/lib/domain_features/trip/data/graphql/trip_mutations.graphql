#import "trip_fields.graphql"
#import "/domain_features/stored_file/data/graphql/file_storage_fields.graphql"
#import "/domain_features/trip/data/graphql/trip_fields.graphql"

mutation UpdateTrip($id: UUID!, $input: TripUpdateInput!) {
    updateTrip(input: $input, id: $id) {
        ...TripFields
    }
}

mutation CreateBlankTrip() {
    createBlankTrip() {
        ...TripFields
    }
}

mutation DeleteTrip($id : UUID!) {
    deleteTrip(id : $id)
}
