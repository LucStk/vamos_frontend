#import "/stored_file/data/graphql/file_storage_fields.graphql"
#import "/topology/data/graphql/fields/vertex_fields.graphql"
#import "/topology/data/graphql/fields/segment_fields.graphql"
fragment TripFields on TripType {
    id
    title
    date
    description
    files {
        ...FileAttachment
    }
}
fragment TopologyFields on TopologyType {
    vertices {
        ...VertexFields
    }
    segments {
        ...SegmentFields
    }
}
