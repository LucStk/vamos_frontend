#import "trip_fields.graphql"
#import "/stored_file/data/graphql/file_storage_fields.graphql"

mutation CreateBlankTrip(){
    createBlankTrip(){
        ...TripFields
    }
}
mutation UpdateTrip($trip: TripUpdateInput!, $id: UUID!) {
    updateTrip(trip: $trip, id: $id) {
        ...TripFields
    }
}
mutation DeleteTrip($id: UUID!) {
    deleteTrip(id: $id)
}
mutation AttachFileToTrip($input: AttachFileTripInput!){
    attachFileToTrip(input:$input ){
        ...StoredFile
    }
}
