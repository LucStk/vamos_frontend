targets:
  $default:
    sources:
      - $package$
      - lib/**
      - graphql/**

    builders:
      ferry_generator2|graphql_builder:
        options:
          schema:
            file: vamos_cartographie|lib/core/graphql/schema.graphql
          scalars:
            UUID:
              type: String
            Date:
              type: String

            DateTime:
              type: String

            Polygon:
              type: GeoPolygonDto
              import: package:vamos_cartographie/core/geometry_mappers/geo_polygon_dto.dart
              from_json: geoPolygonDtoFromJson
              to_json: geoPolygonDtoToJson
          outputs:
            ast: true
            data: true
            vars: true
            req: true
            schema: true

          data_classes:
            reuse_fragments: true

            when_extensions:
              when: true
              maybe_when: true

            utils:
              copy_with: true
              equals: true
              hash_code: true
              to_string: true

          vars:
            tristate_optionals: true

          enums:
            fallback:
              global: true
              name: gUnknownEnumValue
