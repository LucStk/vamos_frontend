"""Exposes a URL that specifies the behavior of this scalar."""
directive @specifiedBy(
  """The URL that specifies the behavior of this scalar."""
  url: String!
) on SCALAR

"""Indicates an Input Object is a OneOf Input Object."""
directive @oneOf on INPUT_OBJECT

type CreateWaypointPayload {
  waypoint: WaypointType!
  vertex: VertexType!
}

"""Date (isoformat)"""
scalar Date

type InsertVertexToSegmentPayload {
  segmentLeft: SegmentType!
  segmentRight: SegmentType!
}

input LatLngInput {
  lat: Float!
  lng: Float!
}

type LatLngType {
  lat: Float!
  lng: Float!
}

type MediaAttachmentType {
  image: MediaImageType!
  order: Int!
}

input MediaImageInput {
  fileKey: String!
}

type MediaImageType {
  fileKey: String!
  url: String!
}

enum MobilityType {
  BIKE
  CAR
  BOAT
  WALK
  TRAIN
}

type Mutation {
  createTrip(trip: TripInput!): TripType!
  updateTrip(id: Int!, trip: TripUpdateInput!): TripType!
  deleteTrip(id: Int!): Boolean!
  createBlankTrip: TripType!
  createImage(data: MediaImageInput!): MediaImageType!
  generateImageUploadUrl(extension: String!): UploadConfig!
  attachImageTo(id: Int!, type: OwnerType!, fileKey: String!): MediaAttachmentType!
  deleteImageFrom(id: Int!, type: OwnerType!, fileKey: String!): String!
  updateWaypoint(id: Int!, input: WaypointUpdateInput!): WaypointType!
  createWaypoint(tripId: Int!, input: WaypointCreateInput!): CreateWaypointPayload!
  deleteWaypoint(id: Int!): Boolean!
  insertVertexToSegment(vertexId: Int!, segmentId: Int!): InsertVertexToSegmentPayload!
  updateSegment(id: Int!, input: SegmentUpdateInput!): SegmentType!
  createSegment(tripId: Int!, input: SegmentCreateInput!): SegmentType!
  deleteSegment(id: Int!): Boolean!
  moveVertex(id: Int!, latLng: LatLngInput!): VertexType!
  createVertex(tripId: Int!, latLng: LatLngInput!): VertexType!
  deleteVertex(id: Int!): Boolean!
}

enum OwnerType {
  TRIP
  WAYPOINT
}

enum PoiCategory {
  START
  END
  WAYPOINT
  WATER
  FOOD
  REPAIR
  SHELTER
  CAMPING
  VIEWPOINT
  HISTORIC
  BEACH
  BOAT
  WARNING
}

type Query {
  trips: [TripType!]!
  trip(id: Int!): TripType!
}

input SegmentCreateInput {
  mobilityType: MobilityType!
  startVertexId: Int!
  endVertexId: Int!
}

type SegmentType {
  id: Int!
  mobilityType: MobilityType!
  startVertex: VertexType!
  endVertex: VertexType!
  geometry: [LatLngType!]!
}

input SegmentUpdateInput {
  mobilityType: MobilityType
  startVertexId: Int
  endVertexId: Int
}

type TopologyType {
  vertices: [VertexType!]!
  segments: [SegmentType!]!
}

input TripInput {
  title: String!
  description: String
  date: Date
}

type TripType {
  id: Int!
  title: String!
  description: String!
  date: Date
  waypoints: [WaypointType!]!
  topology: TopologyType!
}

input TripUpdateInput {
  title: String
  description: String
  date: Date
}

type UploadConfig {
  uploadUrl: String!
  fileKey: String!
}

type VertexType {
  id: Int!
  latLng: LatLngType!
}

input WaypointCreateInput {
  poiCategory: PoiCategory!
  title: String = null
  description: String = null
  vertexId: Int = null
  latLng: LatLngInput = null
}

type WaypointType {
  id: Int!
  title: String!
  description: String!
  poiCategory: PoiCategory!
  vertex: VertexType!
}

input WaypointUpdateInput {
  title: String
  poiCategory: PoiCategory
  vertexId: Int
  description: String
}

