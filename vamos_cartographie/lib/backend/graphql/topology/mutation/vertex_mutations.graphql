#import "../fields/vertex_fields.graphql"

mutation CreateVertex($tripId: Int!, $latLng: LatLngInput!) {
    createVertex(tripId: $tripId, latLng: $latLng) {
        ...VertexFields
    }
}

mutation MoveVertex($id: UUID!, $latLng: LatLngInput!) {
    moveVertex(id: $id, latLng: $latLng) {
        ...VertexFields
    }
}

mutation DeleteVertex($vertexId: UUID!) {
    deleteVertex(id: $vertexId)
}
