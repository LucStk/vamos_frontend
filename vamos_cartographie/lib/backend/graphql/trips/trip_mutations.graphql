#import "../waypoints/waypoint_fields.graphql"
#import "trip_fields.graphql"
#import "../media/image_fields.graphql"

mutation CreateBlankTrip(){
    createBlankTrip(){
        ...TripFields
    }
}

mutation UpdateTrip($trip: TripUpdateInput!, $id: Int!) {
    updateTrip(trip: $trip, id: $id) {
        ...TripFields
    }
}

mutation DeleteTrip($id: Int!) {
    deleteTrip(id: $id)
}
