#import "/waypoint/data/graphql/waypoint_fields.graphql"
#import "trip_fields.graphql"
#import "/media/data/graphql/image_fields.graphql"

mutation CreateBlankTrip(){
    createBlankTrip(){
        ...TripFields
    }
}

mutation UpdateTrip($trip: TripUpdateInput!, $id: UUID!) {
    updateTrip(trip: $trip, id: $id) {
        ...TripFields
    }
}

mutation DeleteTrip($id: UUID!) {
    deleteTrip(id: $id)
}
