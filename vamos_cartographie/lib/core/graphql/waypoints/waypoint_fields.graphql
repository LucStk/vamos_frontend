#import "../media/image_fields.graphql"
#import "../topology/fields/vertex_fields.graphql"

fragment WaypointFields on WaypointType {
    id
    poiCategory
    title
    description
    images {
        ...ImageFields
    }
}
fragment CreateWaypointPayloadFields on CreateWaypointPayload {
    waypoint {
        ...WaypointFields
    }
    vertex {
        ...VertexFields
    }
}
