#import "../waypoints/waypoint_fields.graphql"
#import "trip_fields.graphql"
#import "../topology/fields/segment_fields.graphql"
#import "../topology/fields/vertex_fields.graphql"

query GetAllTrips {
    trips {
        ...TripFields
    }
}

query GetTrip($id: UUID!) {
    trip(id: $id) {
        ...TripFields
    }
}

query GetTripDetails($id: UUID!) {
    trip(id: $id) {
        ...TripFields
        waypoints {
            ...WaypointFields
        }
        topology {
            vertices {
                ...VertexFields
            }
            segments {
                ...SegmentFields
            }
        }
    }
}
