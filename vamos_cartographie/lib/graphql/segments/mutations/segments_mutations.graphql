#import "../fragments/segment_fields.graphql"
mutation UpdateSegment($id: Int!, $segment: SegmentUpdateInput!) {
    updateSegment(segment: $segment, id: $id) {
        ...SegmentFields
    }
}
mutation CreateSegment($tripId: Int!, $segment: SegmentCreateInput!) {
    createSegment(tripId: $tripId, segment: $segment) {
        ...SegmentFields
    }
}

mutation DeleteSegment($segmentId: Int!) {
    deleteSegment(id: $segmentId)
}
