#import "../fragments/waypoint_fields.graphql"
#import "../../media/fragments/image_fields.graphql"
mutation UpdateWaypoint($id: Int!, $waypoint: WaypointUpdateInput!) {
    updateWaypoint(waypoint: $waypoint, id: $id) {
        ...WaypointFields
    }
}
mutation CreateWaypoint(
    $tripId: Int!
    $vertexId: Int!
    $waypoint: WaypointCreateInput!
) {
    createWaypoint(tripId: $tripId, vertexId: $vertexId, waypoint: $waypoint) {
        ...WaypointFields
    }
}

mutation DeleteWaypoint($waypointId: Int!) {
    deleteWaypoint(id: $waypointId)
}

mutation DeleteImageFromWaypoint($waypointId: Int!, $fileKey: String!) {
    deleteImageFromWaypoint(waypointId: $waypointId, fileKey: $fileKey)
}

mutation AttachImageToWaypoint($waypointId: Int!, $fileKey: String!) {
    attachImageToWaypoint(waypointId: $waypointId, fileKey: $fileKey) {
        image {
            ...ImageFields
        }
    }
}
