# ===========================================================================
# Schema GraphQL — vamos_cartographie
# À copier/importer dans votre backend GraphQL
# ===========================================================================

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------

enum WaypointType {
    start
    end
    waypoint
    water
    food
    repair
    shelter
    camping
    viewpoint
    historic
    beach
    boat
    warning
}

enum SegmentType {
    bike
    car
    boat
    walk
    train
}

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------

type LatLng {
    lat: Float!
    lng: Float!
}

type Waypoint {
    id: ID!
    lat: Float!
    lng: Float!
    type: WaypointType!
    description: String!
    imageUrls: [String!]!
}

type Segment {
    id: ID!
    type: SegmentType!
    intermediatePoints: [LatLng!]!
}

type TripInfo {
    title: String!
    description: String!
    date: String
    imageUrls: [String!]!
}

type Trip {
    id: ID!
    tripInfo: TripInfo!
    waypoints: [Waypoint!]!
    segments: [Segment!]!
}

# ---------------------------------------------------------------------------
# Input types
# ---------------------------------------------------------------------------

input LatLngInput {
    lat: Float!
    lng: Float!
}

input WaypointInput {
    lat: Float!
    lng: Float!
    type: WaypointType!
    description: String!
    imageUrls: [String!]!
}

input SegmentInput {
    type: SegmentType!
    intermediatePoints: [LatLngInput!]!
}

input TripInfoInput {
    title: String!
    description: String!
    date: String
    imageUrls: [String!]!
}

input TripInput {
    tripInfo: TripInfoInput!
    waypoints: [WaypointInput!]!
    segments: [SegmentInput!]!
}

# ---------------------------------------------------------------------------
# Queries
# ---------------------------------------------------------------------------

type Query {
    """
    Récupère une trip par son ID
    """
    trip(id: ID!): Trip

    """
    Liste toutes les trips
    """
    trips: [Trip!]!
}

# ---------------------------------------------------------------------------
# Mutations (Relay-style)
# ---------------------------------------------------------------------------

input CreateTripInput {
    clientMutationId: String
    trip: TripInput!
}

type CreateTripPayload {
    clientMutationId: String
    trip: Trip!
}

input UpdateTripInput {
    clientMutationId: String
    id: ID!
    trip: TripInput!
}

type UpdateTripPayload {
    clientMutationId: String
    trip: Trip!
}

input DeleteTripInput {
    clientMutationId: String
    id: ID!
}

type DeleteTripPayload {
    clientMutationId: String
    deletedId: ID!
}

type Mutation {
    """
    Crée une nouvelle trip
    """
    createTrip(input: CreateTripInput!): CreateTripPayload!

    """
    Met à jour une trip existante
    """
    updateTrip(input: UpdateTripInput!): UpdateTripPayload!

    """
    Supprime une trip
    """
    deleteTrip(input: DeleteTripInput!): DeleteTripPayload!
}
