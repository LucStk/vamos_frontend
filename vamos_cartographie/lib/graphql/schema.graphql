"""Exposes a URL that specifies the behavior of this scalar."""
directive @specifiedBy(
  """The URL that specifies the behavior of this scalar."""
  url: String!
) on SCALAR

"""Indicates an Input Object is a OneOf Input Object."""
directive @oneOf on INPUT_OBJECT

"""Date (isoformat)"""
scalar Date

input LatLngInput {
  lat: Float!
  lng: Float!
}

type LatLngType {
  lat: Float!
  lng: Float!
}

input MediaImageInput {
  fileKey: String!
}

type MediaImageType {
  fileKey: String!
  url: String!
}

type Mutation {
  createTrip(trip: TripInput!): TripType!
  deleteTrip(input: TripDeleteInput!): TripType!
  attachImageToTrip(tripId: Int!, fileKey: String!): TripImageType!
  updateTrip(id: Int!, trip: TripUpdateInput!): TripType!
  deleteImageFromTrip(tripId: Int!, fileKey: String!): String!
  createImage(data: MediaImageInput!): MediaImageType!
  generateImageUploadUrl(extension: String!): UploadConfig!
  attachImageToWaypoint(waypointId: Int!, fileKey: String!): WaypointImageType!
  deleteImageFromWaypoint(waypointId: Int!, fileKey: String!): String!
  updateWaypoint(id: Int!, waypoint: WaypointUpdateInput!): WaypointType!
}

type Query {
  trips: [TripType!]!
  trip(id: Int!): TripType!
}

input SegmentInput {
  type: SegmentTypeEnum!
  intermediatePoints: [LatLngInput!]!
}

type SegmentType {
  type: SegmentTypeEnum!
  intermediatePoints: [LatLngType!]!
}

enum SegmentTypeEnum {
  bike
  car
  boat
  walk
  train
}

input TripDeleteInput {
  id: Int!
}

type TripImageType {
  image: MediaImageType!
  order: Int!
}

input TripInput {
  title: String!
  description: String
  date: Date
  waypoints: [WaypointInput!] = null
  segments: [SegmentInput!] = null
}

type TripType {
  id: Int!
  title: String!
  description: String!
  date: Date
  images: [TripImageType!]!
  waypoints: [WaypointType!]!
  segments: [SegmentType!]!
}

input TripUpdateInput {
  title: String
  description: String
  date: Date
  waypoints: [WaypointInput!] = null
  segments: [SegmentInput!] = null
}

type UploadConfig {
  uploadUrl: String!
  fileKey: String!
}

enum WaypointEnum {
  START
  END
  WAYPOINT
  WATER
  FOOD
  REPAIR
  SHELTER
  CAMPING
  VIEWPOINT
  HISTORIC
  BEACH
  BOAT
  WARNING
}

type WaypointImageType {
  image: MediaImageType!
  order: Int!
}

input WaypointInput {
  lat: Float!
  lng: Float!
  title: String
  type: WaypointEnum!
  description: String
}

type WaypointType {
  id: Int!
  lat: Float!
  lng: Float!
  title: String!
  description: String!
  images: [WaypointImageType!]!
  type: WaypointEnum!
}

input WaypointUpdateInput {
  lat: Float
  lng: Float
  title: String
  type: WaypointEnum
  description: String
}

