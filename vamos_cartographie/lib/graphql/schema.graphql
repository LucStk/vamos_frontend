"""Exposes a URL that specifies the behavior of this scalar."""
directive @specifiedBy(
  """The URL that specifies the behavior of this scalar."""
  url: String!
) on SCALAR

"""Indicates an Input Object is a OneOf Input Object."""
directive @oneOf on INPUT_OBJECT

"""Date (isoformat)"""
scalar Date

input LatLngInput {
  lat: Float!
  lng: Float!
}

type LatLngType {
  lat: Float!
  lng: Float!
}

input MediaImageInput {
  fileKey: String!
}

type MediaImageType {
  fileKey: String!
  url: String!
}

type Mutation {
  createTrip(trip: TripInput!): TripType!
  attachImageToTrip(tripId: Int!, fileKey: String!): TripImageType!
  updateTrip(id: Int!, trip: TripUpdateInput!): TripType!
  deleteImageFromTrip(tripId: Int!, fileKey: String!): String!
  deleteTrip(id: Int!): Boolean!
  createImage(data: MediaImageInput!): MediaImageType!
  generateImageUploadUrl(extension: String!): UploadConfig!
  attachImageToWaypoint(waypointId: Int!, fileKey: String!): WaypointImageType!
  deleteImageFromWaypoint(waypointId: Int!, fileKey: String!): String!
  updateWaypoint(id: Int!, input: WaypointUpdateInput!): WaypointType!
  createWaypoint(tripId: Int!, input: WaypointCreateInput!): WaypointType!
  deleteWaypoint(id: Int!): Boolean!
  updateSegment(id: Int!, segment: SegmentUpdateInput!): SegmentType!
  createSegment(tripId: Int!, segment: SegmentCreateInput!): SegmentType!
  deleteSegment(id: Int!): Boolean!
  moveVertex(id: Int!, latLng: LatLngInput!): VertexType!
  createVertex(tripId: Int!, latLng: LatLngInput!): VertexType!
  deleteVertex(id: Int!): Boolean!
}

type Query {
  trips: [TripType!]!
  trip(id: Int!): TripType!
}

input SegmentCreateInput {
  type: SegmentTypeEnum!
  startVertexId: Int!
  endVertexId: Int!
}

type SegmentType {
  id: Int!
  type: SegmentTypeEnum!
  startVertex: VertexType!
  endVertex: VertexType!
  geometry: [LatLngType!]!
}

enum SegmentTypeEnum {
  bike
  car
  boat
  walk
  train
}

input SegmentUpdateInput {
  type: SegmentTypeEnum
  startVertexId: Int
  endVertexId: Int
}

type TopologyType {
  vertices: [VertexType!]!
  segments: [SegmentType!]!
}

type TripImageType {
  image: MediaImageType!
  order: Int!
}

input TripInput {
  title: String!
  description: String
  date: Date
}

type TripType {
  id: Int!
  title: String!
  description: String!
  date: Date
  images: [TripImageType!]!
  waypoints: [WaypointType!]!
  topology: TopologyType!
}

input TripUpdateInput {
  title: String
  description: String
  date: Date
}

type UploadConfig {
  uploadUrl: String!
  fileKey: String!
}

type VertexType {
  id: Int!
  latLng: LatLngType!
}

input WaypointCreateInput {
  type: WaypointEnum!
  title: String = null
  description: String = null
  vertexId: Int = null
  latLng: LatLngInput = null
}

enum WaypointEnum {
  START
  END
  WAYPOINT
  WATER
  FOOD
  REPAIR
  SHELTER
  CAMPING
  VIEWPOINT
  HISTORIC
  BEACH
  BOAT
  WARNING
}

type WaypointImageType {
  image: MediaImageType!
  order: Int!
}

type WaypointType {
  id: Int!
  title: String!
  description: String!
  images: [WaypointImageType!]!
  type: WaypointEnum!
  vertex: VertexType!
}

input WaypointUpdateInput {
  title: String
  type: WaypointEnum
  vertexId: Int
  description: String
}

